[package]
name = "kestrel-mcp"
version = "0.1.0"
description = "MCP server (stdio) for Kestrel secrets, gated by per-field grants"
edition = "2021"
rust-version = "1.90"

[[bin]]
name = "kestrel-mcp"
path = "src/main.rs"

# Deliberately no `kestrel-core` and no `tauri`: this binary is a pipe client,
# and a client that could link the vault would be a second path to the secrets.
# The only shared contract is the JSON protocol owned by the shell.
[dependencies]
serde_json = "1"
