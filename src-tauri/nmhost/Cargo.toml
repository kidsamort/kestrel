[package]
name = "kestrel-nmhost"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "Native messaging host that lets a browser extension reach Kestrel"

[dependencies]
serde_json = "1"
thiserror = "1"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
] }

